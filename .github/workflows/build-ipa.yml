name: Build unsigned IPA

# Runs on GitHub's macOS machines (they have Xcode — this is the step
# that cannot happen on the Linux workspace VM).
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls /Applications | grep Xcode
          sudo xcode-select -s /Applications/Xcode_26*.app 2>/dev/null || \
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Decode bundled WASM (pushed as base64 — connector is text-only)
        run: openssl base64 -d -in ScamDestroyerIOS/Resources/playground/glue.wasm.b64 -out ScamDestroyerIOS/Resources/playground/glue.wasm

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project ScamDestroyerIOS.xcodeproj \
            -scheme ScamDestroyerIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          APP=$(find build -name "ScamDestroyerIOS.app" -type d | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ScamDestroyerIOS-v1.0-unsigned.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScamDestroyerIOS-v1.0-unsigned-ipa
          path: ScamDestroyerIOS-v1.0-unsigned.ipa
