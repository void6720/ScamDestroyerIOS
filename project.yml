# XcodeGen spec — run `xcodegen generate` in this folder on a Mac,
# or create the project in Xcode 26 and add the ScamDestroyerIOS group.
name: ScamDestroyerIOS
options:
  bundleIdPrefix: com.scamdestroyer
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  ScamDestroyerIOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - ScamDestroyerIOS
      - path: ScamDestroyerIOS/Resources/playground
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scamdestroyer.app.ios
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchStoryboardName: ""
